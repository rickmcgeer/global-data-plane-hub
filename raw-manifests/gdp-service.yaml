# Captured via `kubectl get deployment/service gdp-service -n jupyter-ai -o yaml`
# on 2026-08-10, cleaned of managed-fields/status/live-cluster-only fields.
#
# NOT part of the jupyter-ai-1 Helm release (`helm list` only shows that one
# release) - this was applied directly with kubectl, separately from the
# Hub. Preserve this as-is when migrating; only the Hub's own
# gdp-service-config (in ../values.yaml) references it by service name.
#
# GOOGLE_APPLICATION_CREDENTIALS points to a path with no corresponding
# volume/volumeMount on this Deployment - the key file is presumably baked
# directly into the rickmcgeer/gdp-sidecar:20251023 image itself, not
# mounted from a Secret. Worth knowing, not fixed here.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gdp
  name: gdp-service
  namespace: jupyter-ai
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gdp
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gdp
    spec:
      containers:
        - env:
            - name: DEBUG_GDP
              value: "false"
            - name: DEBUG_GDP_USER
              value: rick@galyleo.ai
            - name: DEBUG
              value: "false"
            - name: GOOGLE_PROJECT
              value: civil-pattern-439416-k1
            - name: BUCKET_NAME
              value: bearborg-static
            - name: CLOUD_ENVIRONMENT
              value: Google
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /home/mcgeer/jupyter-ai/.keys/civil-pattern-439416-k1-c15436db5baf.json
            - name: JUPYTERHUB_API_URL
              value: http://hub:8081/hub/api
            - name: JUPYTERHUB_URL
              value: https://bearborg.global-data-plane.org
            - name: OAUTH_CALLBACK_URL
              value: /services/gdp/callback
            - name: GDP_SERVICE_API_TOKEN
              value: "<REDACTED: must match hub.extraConfig.gdp-service-config's api_token in ../values.yaml - kubectl get deployment gdp-service -n jupyter-ai -o jsonpath='{.spec.template.spec.containers[0].env}'>"
            - name: GDP_CLIENT_ID
              value: service-gdp
            - name: GDP_BASE_URL
              value: https://bearborg.global-data-plane.org/services/gdp
            - name: GDP_AUTH_TOKEN_VAR
              value: JUPYTER_HUB_TOKEN
            - name: FLASK_STATIC_URL
              value: /services/gdp/static
          image: rickmcgeer/gdp-sidecar:20251023
          imagePullPolicy: IfNotPresent
          name: gdp-service
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gdp-service
  namespace: jupyter-ai
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    app: gdp
  sessionAffinity: None
  type: ClusterIP
